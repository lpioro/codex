<!doctype html><html lang="pl"><meta charset="utf-8"><title>WalleeGuard — ustawienia</title><body>
<h1><img src="icons/icon-48.png" width="48" height="48" alt=""> WalleeGuard</h1><p>Włączenie zapisuje treść wysyłanych promptów z ChatGPT, Claude i Gemini w Twojej bazie. Nie zapisuje odpowiedzi ani załączników. Kolejka i token są przechowywane lokalnie w profilu Chrome.</p>
<form id="settings"><p><label>Adres kolektora <input id="endpoint" type="url" required placeholder="https://prompts.example.com"></label></p><p><label>Token API <input id="token" type="password" required autocomplete="off"></label></p><p><label><input id="enabled" type="checkbox"> Włącz przechwytywanie promptów</label></p><button>Zapisz i nadaj dostęp</button></form>
<p id="status" role="status"></p><button id="clear">Usuń oczekujące prompty</button><script src="options.js"></script></body></html>
